name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          runtime: node@24.19.0
          cache: true
          require-lockfile: true

      - name: Verify locked policy
        run: pnpm policy:verify

      - name: Verify repository
        run: pnpm verify

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://gateway_test:gateway-test-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/family_brain_gateway_test
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: gateway_ci_admin
          POSTGRES_PASSWORD: gateway-ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_ci_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          runtime: node@24.19.0
          cache: true
          require-lockfile: true

      - name: Provision least-privilege test database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          GATEWAY_TEST_PASSWORD: gateway-test-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" psql \
            --username gateway_ci_admin \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE gateway_test LOGIN PASSWORD '$GATEWAY_TEST_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;"
          docker exec "$POSTGRES_CONTAINER_ID" createdb \
            --username gateway_ci_admin \
            --owner gateway_test \
            family_brain_gateway_test

      - name: Apply migrations twice
        run: |
          pnpm db:migrate:test
          pnpm db:migrate:test

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      # Mocked providers only: no credentials, project or state backend.
      - name: Format, validate and plan
        run: bash scripts/check-infrastructure.sh

      # The rendered cloud-config, the systemd units and the host scripts, in
      # a throwaway container with stubbed docker, iptables and disk tools.
      - name: VM host layer
        run: bash scripts/check-vm-host.sh

  container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build, smoke-test and scan
        run: bash scripts/check-container.sh family-brain-gateway:ci

      # Synthetic data only: socket-only PostgreSQL, peer-authenticated
      # migrations, encrypted backup, no-overwrite upload, restore and counts.
      - name: Backup and restore round trip
        run: bash scripts/check-backup-roundtrip.sh family-brain-gateway:ci
      # Recovery point investigation, section 12: a lost database recovered
      # within one (scaled) 15-minute interval, through isolated validation.
      # The real pinned nginx with the VM's rendered configuration: request
      # limits before the upstream, forged forwarding headers, TLS names and
      # port 80.
      - name: Ingress (nginx) checks
        timeout-minutes: 5
        run: bash scripts/check-edge.sh
      - name: Recovery point (RPO) test
        timeout-minutes: 10
        run: bash scripts/check-backup-rpo.sh family-brain-gateway:ci
