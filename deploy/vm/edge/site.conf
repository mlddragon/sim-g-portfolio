# The TLS server for @DOMAIN@ (included by nginx.conf once its certificate
# exists). The gateway is served only here.
server {
  listen 8443 ssl;
  server_name @DOMAIN@;

  ssl_certificate /etc/sim-g/certs/live/@DOMAIN@/fullchain.pem;
  ssl_certificate_key /etc/sim-g/certs/live/@DOMAIN@/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:1m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000" always;

  limit_conn conn_per_ip 16;

  location @rate_limited {
    default_type application/json;
    # add_header here replaces the server's, so HSTS is repeated.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"error":{"code":"rate_limited","retryable":true,"details":{"reason":"ingress_rate_limited"}}}';
  }

  # The health check: its own per-address bucket, but the shared cap too, so
  # a spread flood cannot reach Node through it. Only the exact URI: nginx
  # matches the normalized path but forwards the raw one.
  location = /healthz {
    limit_req zone=health_per_ip burst=10 nodelay;
    limit_req zone=all_clients burst=60 nodelay;
    if ($request_uri != "/healthz") {
      return 404;
    }
    proxy_pass http://gateway;
  }

  # The gateway's three content mutations accept up to 2 MiB; the body
  # streams to the gateway rather than to nginx's small /tmp.
  location ~ ^/v1/operations/(persist_knowledge|update_record|append_to_record)$ {
    limit_req zone=per_ip burst=30 nodelay;
    limit_req zone=all_clients burst=60 nodelay;
    client_max_body_size 2m;
    proxy_request_buffering off;
    proxy_pass http://gateway;
  }

  location / {
    limit_req zone=per_ip burst=30 nodelay;
    limit_req zone=all_clients burst=60 nodelay;
    proxy_pass http://gateway;
  }
}
