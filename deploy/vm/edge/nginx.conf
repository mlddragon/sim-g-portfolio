# SIM-G ingress (VM design sections 3 and 4): the only published service.
# sim-g-edge.sh renders this file; its only substitutions are @DOMAIN@ (the
# validated host name) and @UPSTREAM@ (the gateway's fixed address on the
# internal bridge). Port 80 serves certificate validation and a redirect
# only; the gateway is reached only over TLS on 443.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  server_tokens off;
  # Request lines can carry record identifiers; the gateway's own audit and
  # telemetry are the request record.
  access_log off;
  # A missing file (an unknown ACME token) is a 404, not an operational
  # error; logging it would put the client's address in Cloud Logging. Real
  # errors (an unreachable gateway) still log, with the client address,
  # which a flood or abuse diagnosis needs (F13d Stage A).
  log_not_found off;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Slow or oversized clients are cut off before they cost the gateway. The
  # body limit is the gateway's default (64 KiB); site.conf allows the
  # gateway's 2 MiB on the three content mutations only. Header buffers fit
  # the gateway's longest accepted bearer token.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;
  keepalive_requests 100;
  client_header_buffer_size 4k;
  large_client_header_buffers 2 20k;
  client_max_body_size 64k;

  # Request limits before Node. Every zone is keyed on the TCP peer
  # ($binary_remote_addr) or the server, never on a header, so a forged
  # X-Forwarded-For cannot move a client to another bucket.
  #   - per_ip: 2 requests/s with a burst of 30, the gateway's own steady
  #     rate (120 a minute) with a smaller burst than its fixed window, so a
  #     flood is shed here;
  #   - all_clients: 15 requests/s with a burst of 60 across every address,
  #     below the measured saturation of 0.25 vCPU (F13b), so a spread flood
  #     cannot exhaust the VM;
  #   - health_per_ip: the uptime check's own bucket.
  limit_req_zone $binary_remote_addr zone=per_ip:4m rate=2r/s;
  limit_req_zone $server_name zone=all_clients:64k rate=15r/s;
  limit_req_zone $binary_remote_addr zone=health_per_ip:1m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:2m;
  limit_req_status 429;
  limit_conn_status 429;
  # The gateway's own rate-limit shape, with Retry-After (see @rate_limited).
  error_page 429 = @rate_limited;
  # Rejections are not logged (error_log is at warn), so a flood cannot
  # flood the log path.
  limit_req_log_level info;
  limit_conn_log_level info;

  upstream gateway {
    server @UPSTREAM@;
    keepalive 8;
  }

  # The gateway trusts exactly one hop (GATEWAY_TRUSTED_PROXY_HOPS=1): this
  # proxy. X-Forwarded-For is replaced with the TCP peer, never appended to,
  # and the other forwarding headers are cleared.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host @DOMAIN@;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Port "";
  proxy_set_header X-Real-IP "";
  proxy_set_header Forwarded "";
  # Responses stream to the client; nothing is buffered to disk.
  proxy_max_temp_file_size 0;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  # Above the gateway's own request timeout (operation timeout plus 5 s).
  proxy_read_timeout 45s;

  # Port 80: certificate validation and a redirect to the fixed name only.
  server {
    listen 8080 default_server;
    limit_req zone=per_ip burst=30 nodelay;
    limit_conn conn_per_ip 16;

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"rate_limited","retryable":true,"details":{"reason":"ingress_rate_limited"}}}';
    }

    location /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
    }

    location / {
      return 301 https://@DOMAIN@$request_uri;
    }
  }

  # Any other name, or none, gets no certificate on 443. A request whose
  # Host differs from the name it shook hands with lands here too, and is
  # closed without a response (444), before anything else runs.
  server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
  }

  # The TLS server, once a certificate exists (empty before then).
  include /etc/nginx/sim-g/site.conf;
}
